kind = "web"
previewPath = "/"
title = "Reffenthal Dashboard"
description = "A monitoring dashboard for the Reffenthal-Wächter system. Shows water level (Pegelstand) history as a chart, lists recently detected web matches, and displays the last watcher run time. Used by the site operator to check water levels and alerts at a glance without opening Telegram."
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"
