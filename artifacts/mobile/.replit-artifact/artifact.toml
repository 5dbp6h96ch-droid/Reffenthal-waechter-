kind = "mobile"
previewPath = "/mobile/"
title = "Reffenthal Mobile"
description = "A mobile companion app for the Reffenthal-Wächter monitoring system. Displays the current Pegel (water level) at Speyer with a green/safe or red/alarm status, a scrollable history chart, and a list of Treffer (forum post matches). Designed for quick daily check-ins: is the Einfahrt passable?"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
