openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waechter
    description: Reffenthal-Wächter monitoring data
  - name: nfb
    description: Nachrichtenblatt für Binnenschifffahrt (NfB) notices
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /waechter/state:
    get:
      operationId: getWaechterState
      tags: [waechter]
      summary: Get current water level state and history
      description: Returns the current Pegelstand (water level) and history from state.json
      responses:
        "200":
          description: Water level state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaechterState"

  /waechter/treffer:
    get:
      operationId: getWaechterTreffer
      tags: [waechter]
      summary: Get list of seen/sent URLs
      description: Returns the list of URLs that have already been sent as alerts via Telegram
      responses:
        "200":
          description: List of seen URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaechterTreffer"

  /waechter/clubs:
    get:
      operationId: getWaechterClubs
      tags: [waechter]
      summary: Get club website hits
      description: Returns club/harbour website hits found by the watcher
      responses:
        "200":
          description: Club website hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaechterClubs"

  /waechter/status:
    get:
      operationId: getWaechterStatus
      tags: [waechter]
      summary: Get watcher run status
      description: Returns when the watcher last ran, how many new RSS hits were found, and the last error (if any)
      responses:
        "200":
          description: Watcher run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaechterRunStatus"

  /nfb:
    get:
      operationId: getNfb
      tags: [nfb]
      summary: Get active NfB notices
      description: Returns active Nachrichtenblatt für Binnenschifffahrt (NfB) notices for Rhein km 380–415
      responses:
        "200":
          description: Active NfB notices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfbList"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PegelEntry:
      type: object
      properties:
        cm:
          type: number
          description: Water level in centimeters
        ts:
          type: string
          description: ISO 8601 timestamp of the measurement
      required:
        - cm
        - ts

    WaechterState:
      type: object
      properties:
        last_pegel_cm:
          type: ["number", "null"]
          description: Most recent water level in centimeters
        last_pegel_time:
          type: ["string", "null"]
          description: ISO 8601 timestamp of the most recent measurement
        last_daily_report_date:
          type: ["string", "null"]
          description: Date of the last daily report (YYYY-MM-DD)
        history:
          type: array
          items:
            $ref: "#/components/schemas/PegelEntry"
          description: Historical water level measurements
        threshold_cm:
          type: number
          description: Alert threshold in centimeters (225 cm)
      required:
        - last_pegel_cm
        - last_pegel_time
        - last_daily_report_date
        - history
        - threshold_cm

    WaechterTreffer:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          description: List of URLs that have been sent as Telegram alerts
        count:
          type: number
          description: Total number of seen URLs
      required:
        - urls
        - count

    WaechterRunStatus:
      type: object
      properties:
        last_run_at:
          type: ["string", "null"]
          description: ISO 8601 timestamp of the last completed watcher run
        rss_new_count:
          type: number
          description: Number of new RSS/web hits found in the last run
        last_error:
          type: ["string", "null"]
          description: Last error message if the run encountered an error, null otherwise
      required:
        - last_run_at
        - rss_new_count
        - last_error

    WaechterClubHit:
      type: object
      properties:
        name:
          type: string
          description: Club or harbour name
        icon:
          type: string
          description: Emoji icon for the club
        url:
          type: string
          description: URL of the club website
        snippet:
          type: string
          description: Relevant text snippet from the page
        dedup_key:
          type: string
          description: Deduplication key (club:domain:hash)
        seen_at:
          type: string
          description: ISO 8601 timestamp when first seen
      required:
        - name
        - icon
        - url
        - snippet
        - dedup_key
        - seen_at

    WaechterKnownClub:
      type: object
      properties:
        name:
          type: string
          description: Club or harbour name
        icon:
          type: string
          description: Emoji icon for the club
        url:
          type: string
          description: Homepage URL of the club
      required:
        - name
        - icon
        - url

    WaechterClubs:
      type: object
      properties:
        clubs:
          type: array
          items:
            $ref: "#/components/schemas/WaechterClubHit"
          description: List of club/harbour website hits
        count:
          type: number
          description: Total number of club hits
        known_clubs:
          type: array
          items:
            $ref: "#/components/schemas/WaechterKnownClub"
          description: All monitored clubs (regardless of findings)
      required:
        - clubs
        - count
        - known_clubs

    NfbMeldung:
      type: object
      properties:
        nfb_id:
          type: string
          description: "NfB identifier (e.g. 2026/1911)"
        titel:
          type: string
          description: Title of the NfB notice
        km_von:
          type: ["number", "null"]
          description: Start of the affected river kilometre range
        km_bis:
          type: ["number", "null"]
          description: End of the affected river kilometre range
        gueltig_ab:
          type: ["string", "null"]
          description: "Validity start date (ISO 8601 or text)"
        gueltig_bis:
          type: ["string", "null"]
          description: "Validity end date (ISO 8601 or text)"
        url:
          type: ["string", "null"]
          description: ELWIS source URL
        first_seen:
          type: string
          description: ISO 8601 timestamp when the notice was first recorded
        is_new:
          type: boolean
          description: True if first_seen is within the last 24 hours
      required:
        - nfb_id
        - titel
        - km_von
        - km_bis
        - gueltig_ab
        - gueltig_bis
        - url
        - first_seen
        - is_new

    NfbList:
      type: object
      properties:
        meldungen:
          type: array
          items:
            $ref: "#/components/schemas/NfbMeldung"
          description: Active NfB notices ordered newest first
        count:
          type: number
          description: Total number of active NfB notices
      required:
        - meldungen
        - count
