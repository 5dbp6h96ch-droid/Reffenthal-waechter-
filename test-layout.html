<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rheinschiffer – Layout Editor (Test)</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;background:#eef6fc;color:#111}h1{margin:0 0 8px}p{color:#666}.panel{background:#fff;border:1px solid #cfe1ef;border-radius:16px;padding:20px;max-width:720px}.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}input{width:90px;padding:8px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:10px;background:#087df5;color:white;font-size:16px}</style>
</head>
<body>
<div class="panel">
<h1>Layout Editor – Test</h1>
<p>Separater Editor. Diese Seite verändert noch nichts an der App.</p>
<div class="row"><span>Oberer Abstand</span><input value="5" type="number"> px</div>
<div class="row"><span>Unterer Abstand</span><input value="3" type="number"> px</div>
<div class="row"><span>Icon-Größe</span><input value="24" type="number"> px</div>
<div class="row"><span>Menübalken-Höhe</span><input value="72" type="number"> px</div>
<button type="button">Vorschau (noch nicht aktiv)</button>
</div>
</body>
</html>
