name: Diagnose confirmed rheinschiffer-test Worker download

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Worker download endpoint
        id: probe
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test"
          HTTP=$(curl -sSL -D /tmp/headers.txt -o /tmp/body.bin -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL")
          RC=$?
          TYPE=$(grep -i '^content-type:' /tmp/headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs)
          SIZE=$(wc -c < /tmp/body.bin | tr -d ' ')
          SHA=$(sha256sum /tmp/body.bin | awk '{print $1}')
          printf 'http_status=%s\ncurl_exit=%s\ncontent_type=%s\nbytes=%s\nsha256=%s\n' "$HTTP" "$RC" "$TYPE" "$SIZE" "$SHA" > /tmp/diagnosis.txt
          cat /tmp/diagnosis.txt
          exit 0

      - name: Record non-sensitive download diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo 'target=worker:rheinschiffer-test'
            echo 'confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo "inspected_at=${TS}"
            cat /tmp/diagnosis.txt
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-worker-download-diagnosis.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker download diagnosis" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker download diagnosis" -f content="$CONTENT" -f branch=test
          fi
