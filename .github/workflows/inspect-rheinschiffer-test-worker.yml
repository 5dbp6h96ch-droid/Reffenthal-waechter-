name: Snapshot confirmed rheinschiffer-test Worker source

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download active Worker source from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          OUT='canonical-test-snapshot'
          mkdir -p "$OUT"
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test"
          curl -fsSL -D /tmp/headers.txt -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" -o /tmp/worker-download.bin
          TYPE=$(file -b --mime-type /tmp/worker-download.bin)
          SIZE=$(wc -c < /tmp/worker-download.bin | tr -d ' ')
          SHA=$(sha256sum /tmp/worker-download.bin | awk '{print $1}')
          printf 'mime_type=%s\nbytes=%s\nsha256=%s\n' "$TYPE" "$SIZE" "$SHA" > "$OUT/WORKER-SOURCE-METADATA.txt"
          if grep -aEiq '(PRIVATE KEY-----|CLOUDFLARE_API_TOKEN|SMTP_PASSWORD\s*[:=]\s*["'"'][^"'"']+|VAPID_PRIVATE_KEY\s*[:=]\s*["'"'][^"'"']+)' /tmp/worker-download.bin; then
            echo 'Potential embedded secret detected; source not committed.' >> "$OUT/WORKER-SOURCE-METADATA.txt"
            exit 1
          fi
          cp /tmp/worker-download.bin "$OUT/worker-source.txt"
          cat "$OUT/WORKER-SOURCE-METADATA.txt"

      - name: Commit backend source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-snapshot/WORKER-SOURCE-METADATA.txt canonical-test-snapshot/worker-source.txt
          if git diff --cached --quiet; then
            echo 'Worker source snapshot already identical.'
            exit 0
          fi
          git commit -m 'Snapshot confirmed good rheinschiffer-test Worker source [skip ci]'
          git push origin HEAD:test
