name: Reconstruct canonical rheinschiffer-test project

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble canonical project from confirmed snapshots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/versions/${VERSION}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null
          DB_ID=$(jq -r '.result.resources.bindings[] | select(.type=="d1" and .name=="DB") | (.database_id // .id // "")' /tmp/version.json | head -n1)
          APP_ENV=$(jq -r '.result.resources.bindings[] | select(.type=="plain_text" and .name=="APP_ENV") | (.text // .value // "test")' /tmp/version.json | head -n1)
          test -n "$DB_ID"
          [ -n "$APP_ENV" ] || APP_ENV='test'

          OUT='canonical-test-worker'
          rm -rf "$OUT"
          mkdir -p "$OUT/src" "$OUT/public/pages" "$OUT/public/icons"
          cp canonical-test-snapshot/backend/worker.js "$OUT/src/worker.js"
          cp canonical-test-snapshot/index.html "$OUT/public/index.html"
          cp canonical-test-snapshot/app.js "$OUT/public/app.js"
          cp canonical-test-snapshot/styles.css "$OUT/public/styles.css"
          cp canonical-test-snapshot/action-icons.css "$OUT/public/action-icons.css"
          cp canonical-test-snapshot/sw.js "$OUT/public/sw.js"
          cp canonical-test-snapshot/pages/*.js "$OUT/public/pages/"
          for icon in icon-192.png icon-512.png; do
            HTTP=$(curl -sSL -o "$OUT/public/icons/$icon" -w '%{http_code}' "https://rheinschiffer-test.5dbp6h96ch.workers.dev/icons/$icon")
            if [ "$HTTP" != '200' ]; then rm -f "$OUT/public/icons/$icon"; fi
          done

          jq -n \
            --arg db "$DB_ID" \
            --arg appenv "$APP_ENV" \
            '{
              "$schema":"node_modules/wrangler/config-schema.json",
              name:"rheinschiffer-test",
              main:"src/worker.js",
              compatibility_date:"2026-08-19",
              compatibility_flags:["nodejs_compat"],
              keep_vars:true,
              workers_dev:true,
              assets:{directory:"./public",binding:"ASSETS",not_found_handling:"single-page-application",run_worker_first:true},
              vars:{APP_ENV:$appenv},
              d1_databases:[{binding:"DB",database_id:$db}],
              secrets:{required:["SMTP_PASSWORD","VAPID_PRIVATE_KEY","VAPID_PUBLIC_KEY","VAPID_SUBJECT"]}
            }' > "$OUT/wrangler.jsonc"
          jq -e . "$OUT/wrangler.jsonc" >/dev/null

          cat > "$OUT/README.md" <<'EOF'
          # Canonical rheinschiffer-test Worker

          Reconstructed from the user-confirmed live test Worker version `57cd69f3-d291-465f-b451-dbd8b4e46c88` (alias `clickfix`).

          This directory is the only valid source basis for future canonical test-Worker changes. Do not deploy automatically. The known-good Cloudflare version above remains the rollback target. Secret values are not stored here.
          EOF
          printf 'confirmed_good_version=%s\nalias=clickfix\nbackend_sha256=%s\nfrontend_snapshot=canonical-test-snapshot/SNAPSHOT.txt\nd1_binding=DB\napp_env=%s\n' "$VERSION" 'e696e854ee76ee5b2d56fa3418c76ddcdc2a64ef7a29b66b6c9da8840ca794b1' "$APP_ENV" > "$OUT/ORIGIN.txt"

      - name: Commit canonical project before validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-worker
          if ! git diff --cached --quiet; then
            git commit -m 'Reconstruct canonical rheinschiffer-test Worker project [skip ci]'
            git push origin HEAD:test
          fi

      - name: Dry-run only — never deploy
        id: dryrun
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          cd canonical-test-worker
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/rheinschiffer-dry-run --config wrangler.jsonc >/tmp/dryrun.log 2>&1
          RC=$?
          if [ "$RC" -eq 0 ]; then STATUS=ok; else STATUS=fail; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record dry-run result
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.dryrun.outputs.status }}
          RC: ${{ steps.dryrun.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONTENT=$(printf 'target=canonical-test-worker\naction=dry-run-only\nstatus=%s\nexit=%s\nchecked_at=%s\n' "$STATUS" "$RC" "$TS" | base64 -w0)
          PATH_NAME='deploy-receipts/canonical-test-worker-dry-run.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker dry-run" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker dry-run" -f content="$CONTENT" -f branch=test
          fi
