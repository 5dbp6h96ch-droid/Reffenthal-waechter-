name: Snapshot confirmed rheinschiffer-test frontend

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public files from confirmed good test Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          OUT='canonical-test-snapshot'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          for path in / /app.js /styles.css /action-icons.css /sw.js /manifest.webmanifest; do
            name=$(printf '%s' "$path" | sed 's#^/##')
            [ -n "$name" ] || name='index.html'
            status=$(curl -sSL -o "$OUT/$name" -w '%{http_code}' "$BASE$path")
            if [ "$status" != '200' ]; then
              rm -f "$OUT/$name"
              echo "$path -> HTTP $status (not snapshotted)"
            fi
          done
          {
            echo 'canonical_url=https://rheinschiffer-test.5dbp6h96ch.workers.dev/'
            echo 'confirmed_good_worker_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo 'cloudflare_alias=clickfix'
            echo 'snapshot_source=public_live_files'
            echo 'files:'
            for f in "$OUT"/*; do
              [ -f "$f" ] || continue
              printf '%s\t%s\t%s\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } > "$OUT/SNAPSHOT.txt"
          cat "$OUT/SNAPSHOT.txt"

      - name: Commit immutable frontend snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-snapshot
          if git diff --cached --quiet; then
            echo 'Snapshot already identical.'
            exit 0
          fi
          git commit -m 'Snapshot confirmed good rheinschiffer-test frontend [skip ci]'
          git push origin HEAD:test
