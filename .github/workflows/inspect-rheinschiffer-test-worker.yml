name: Inspect confirmed rheinschiffer-test Worker package

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and inventory active Worker multipart package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test"
          curl -fsSL -D /tmp/headers.txt -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" -o /tmp/body.bin
          CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs)
          export CONTENT_TYPE
          python3 - <<'PY'
          import os, hashlib, json
          from email.parser import BytesParser
          from email.policy import default
          body=open('/tmp/body.bin','rb').read()
          ct=os.environ['CONTENT_TYPE']
          msg=BytesParser(policy=default).parsebytes((f'MIME-Version: 1.0\r\nContent-Type: {ct}\r\n\r\n').encode()+body)
          rows=[]
          for i,part in enumerate(msg.iter_parts()):
              data=part.get_payload(decode=True) or b''
              rows.append({
                  'index':i,
                  'name':part.get_param('name', header='content-disposition') or '',
                  'filename':part.get_filename() or '',
                  'content_type':part.get_content_type(),
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
              })
          open('/tmp/parts.json','w').write(json.dumps(rows,indent=2))
          PY
          cat /tmp/parts.json

      - name: Record multipart inventory only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo 'target=worker:rheinschiffer-test'
            echo 'confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo "inspected_at=${TS}"
            cat /tmp/parts.json
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-worker-multipart-inventory.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker multipart inventory" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical Worker multipart inventory" -f content="$CONTENT" -f branch=test
          fi
