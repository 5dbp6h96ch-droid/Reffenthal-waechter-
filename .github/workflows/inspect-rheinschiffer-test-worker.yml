name: Inspect confirmed rheinschiffer-test Worker resources

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect confirmed good version resource details
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/versions/${VERSION}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null
          jq '
            .result.resources as $r |
            {
              version: .result.id,
              alias: (.result.annotations["workers/alias"] // ""),
              source: (.result.metadata.source // ""),
              created_on: (.result.metadata.created_on // ""),
              last_deployed_from: ($r.script.last_deployed_from // null),
              script_etag: ($r.script.etag // null),
              script_handlers: ($r.script.handlers // []),
              runtime_compatibility_date: ($r.script_runtime.compatibility_date // null),
              runtime_compatibility_flags: ($r.script_runtime.compatibility_flags // []),
              runtime_assets_type: ($r.script_runtime.assets | type),
              runtime_assets_keys: (if ($r.script_runtime.assets|type)=="object" then ($r.script_runtime.assets|keys) else [] end),
              runtime_assets_structure: (
                if ($r.script_runtime.assets|type)=="object" then
                  [$r.script_runtime.assets | to_entries[] | {
                    key: .key,
                    value_type: (.value|type),
                    value_keys: (if (.value|type)=="object" then (.value|keys) else [] end)
                  }]
                elif ($r.script_runtime.assets|type)=="array" then
                  [$r.script_runtime.assets[] | {
                    value_type: (.|type),
                    value_keys: (if (.|type)=="object" then (.|keys) else [] end)
                  }]
                else [] end
              ),
              bindings_count: (($r.bindings // []) | length),
              binding_types: (($r.bindings // []) | map(.type // "") | unique)
            }
          ' /tmp/version.json > /tmp/resources.json
          cat /tmp/resources.json

      - name: Record non-sensitive origin details
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "target=worker:rheinschiffer-test"
            echo "confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88"
            echo "inspected_at=${TS}"
            cat /tmp/resources.json
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-good-worker-origin.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record confirmed test Worker origin details" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record confirmed test Worker origin details" -f content="$CONTENT" -f branch=test
          fi
