name: Snapshot confirmed rheinschiffer-test Worker backend

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract active worker.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test"
          curl -fsSL -D /tmp/headers.txt -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" -o /tmp/body.bin
          CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs)
          export CONTENT_TYPE
          python3 - <<'PY'
          import os
          from email.parser import BytesParser
          from email.policy import default
          body=open('/tmp/body.bin','rb').read()
          ct=os.environ['CONTENT_TYPE']
          msg=BytesParser(policy=default).parsebytes((f'MIME-Version: 1.0\r\nContent-Type: {ct}\r\n\r\n').encode()+body)
          found=[]
          for part in msg.iter_parts():
              name=part.get_param('name', header='content-disposition') or ''
              if name=='worker.js':
                  data=part.get_payload(decode=True) or b''
                  open('/tmp/worker.js','wb').write(data)
                  found.append(len(data))
          if len(found)!=1 or found[0]==0:
              raise SystemExit('worker.js not found exactly once')
          PY
          EXPECTED='e696e854ee76ee5b2d56fa3418c76ddcdc2a64ef7a29b66b6c9da8840ca794b1'
          ACTUAL=$(sha256sum /tmp/worker.js | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          # Reject obvious literal secrets; environment binding names are safe and expected.
          if grep -aEiq '(-----BEGIN [A-Z ]*PRIVATE KEY-----|SMTP_PASSWORD[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,}|VAPID_PRIVATE_KEY[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,}|CLOUDFLARE_API_TOKEN[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,})' /tmp/worker.js; then
            echo 'Literal secret candidate found; refusing to commit backend snapshot.'
            exit 1
          fi
          mkdir -p canonical-test-snapshot/backend
          cp /tmp/worker.js canonical-test-snapshot/backend/worker.js
          printf 'source=active Cloudflare Worker download\nworker=rheinschiffer-test\nversion=57cd69f3-d291-465f-b451-dbd8b4e46c88\nalias=clickfix\nbytes=%s\nsha256=%s\n' "$(wc -c < /tmp/worker.js | tr -d ' ')" "$ACTUAL" > canonical-test-snapshot/backend/SNAPSHOT.txt

      - name: Commit backend snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-snapshot/backend
          if git diff --cached --quiet; then
            echo 'Backend snapshot already identical.'
            exit 0
          fi
          git commit -m 'Snapshot confirmed good rheinschiffer-test backend [skip ci]'
          git push origin HEAD:test
