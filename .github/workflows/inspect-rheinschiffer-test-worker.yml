name: Snapshot confirmed rheinschiffer-test frontend

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-worker.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public files from confirmed good test Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          OUT='canonical-test-snapshot'
          rm -rf "$OUT"
          mkdir -p "$OUT/pages"
          for path in / /app.js /styles.css /action-icons.css /sw.js /manifest.webmanifest \
            /pages/start.js /pages/pegel.js /pages/vorhersage.js /pages/nfb.js \
            /pages/tankstelle.js /pages/clubs.js /pages/rhein-karte.js /pages/news.js \
            /pages/waechter.js /pages/help.js /pages/settings.js /pages/konto.js /pages/passwort.js; do
            rel=$(printf '%s' "$path" | sed 's#^/##')
            [ -n "$rel" ] || rel='index.html'
            mkdir -p "$OUT/$(dirname "$rel")"
            status=$(curl -sSL -o "$OUT/$rel" -w '%{http_code}' "$BASE$path")
            if [ "$status" != '200' ]; then
              rm -f "$OUT/$rel"
              echo "$path -> HTTP $status (not snapshotted)"
            fi
          done
          {
            echo 'canonical_url=https://rheinschiffer-test.5dbp6h96ch.workers.dev/'
            echo 'confirmed_good_worker_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo 'cloudflare_alias=clickfix'
            echo 'snapshot_source=public_live_files'
            echo 'files:'
            find "$OUT" -type f ! -name SNAPSHOT.txt -print0 | sort -z | while IFS= read -r -d '' f; do
              rel=${f#${OUT}/}
              printf '%s\t%s\t%s\n' "$rel" "$(wc -c < "$f" | tr -d ' ')" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } > "$OUT/SNAPSHOT.txt"
          cat "$OUT/SNAPSHOT.txt"

      - name: Commit immutable frontend snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-snapshot
          if git diff --cached --quiet; then
            echo 'Snapshot already identical.'
            exit 0
          fi
          git commit -m 'Snapshot confirmed good rheinschiffer-test page modules [skip ci]'
          git push origin HEAD:test
