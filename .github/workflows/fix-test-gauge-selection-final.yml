name: Final test gauge selection fix

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1

      - name: Apply test-only selection behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()

          # The selection must always close the list immediately.
          old = "onPress={() => { selectGauge(g.id); setGaugeListOpen(false); }}"
          if old not in s:
              raise SystemExit('Expected current gauge selection handler was not found')

          # Defensive state synchronization: whenever the selected gauge changes,
          # the expanded list is closed as well. This is test-only and does not
          # change how gauges are added/removed or how selection is persisted.
          marker = "  const [alertsOpen, setAlertsOpen] = useState(false);"
          effect = """  const [alertsOpen, setAlertsOpen] = useState(false);

  // TEST: Selecting a gauge always collapses the 'Meine Pegel' list.
  useEffect(() => {
    if (selectedGauge) setGaugeListOpen(false);
  }, [selectedGauge]);"""
          if 'Selecting a gauge always collapses the' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one preferences state marker, found {s.count(marker)}')
              s = s.replace(marker, effect, 1)

          # Keep the collapsed state limited to the already selected gauge.
          required = "{!gaugeListOpen && selectedGauge && ("
          if required not in s:
              raise SystemExit('Collapsed selected-gauge display is missing')

          p.write_text(s)
          PY

      - name: Verify test web build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec expo export --platform web --output-dir dist

      - name: Commit test-only fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mobile/components/OriginalHomeScreen.tsx .github/workflows/fix-test-gauge-selection-final.yml
          git commit -m "Fix test Meine Pegel selection collapse [skip ci]"
          git push origin test
