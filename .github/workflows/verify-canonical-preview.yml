name: Verify canonical rheinschiffer-test preview

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/verify-canonical-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded preview only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://512c4b8b-rheinschiffer-test.5dbp6h96ch.workers.dev'
          curl -fsSL "$BASE/" -o /tmp/index
          curl -fsSL "$BASE/app.js" -o /tmp/app
          curl -fsSL "$BASE/sw.js" -o /tmp/sw
          curl -fsSL "$BASE/manifest.webmanifest" -o /tmp/manifest
          curl -fsSL "$BASE/api/push/vapid-public-key" -o /tmp/vapid

          INDEX_SHA=$(sha256sum /tmp/index | awk '{print $1}')
          APP_SHA=$(sha256sum /tmp/app | awk '{print $1}')
          SW_SHA=$(sha256sum /tmp/sw | awk '{print $1}')
          MANIFEST_OK=no
          SW_OK=no
          VAPID_OK=no
          INDEX_OK=no
          [ "$APP_SHA" = '45c6acbb3057204d18bd76a9a58db53262004edd4cb789e0540048e96e227ff8' ]
          grep -q 'R(h)einschiffer' /tmp/index && grep -q 'rel="manifest" href="/manifest.webmanifest"' /tmp/index && INDEX_OK=yes
          grep -q "clients.matchAll({ type: 'window', includeUncontrolled: true })" /tmp/sw && grep -q 'appClient.navigate(targetUrl)' /tmp/sw && grep -q "clients.openWindow(targetUrl)" /tmp/sw && SW_OK=yes
          jq -e '.id=="/" and .start_url=="/" and .scope=="/" and .display=="standalone"' /tmp/manifest >/dev/null && MANIFEST_OK=yes
          jq -e '.configured==true and (.publicKey|type=="string") and (.publicKey|length>20)' /tmp/vapid >/dev/null && VAPID_OK=yes
          test "$INDEX_OK" = yes
          test "$SW_OK" = yes
          test "$MANIFEST_OK" = yes
          test "$VAPID_OK" = yes
          {
            echo 'preview_version=512c4b8b-3364-439b-afc8-d14fc127eb34'
            echo 'preview_result=ok'
            echo "index_sha=$INDEX_SHA"
            echo "app_sha=$APP_SHA"
            echo "sw_sha=$SW_SHA"
            echo "index_manifest=$INDEX_OK"
            echo "sw_clickfix=$SW_OK"
            echo "manifest=$MANIFEST_OK"
            echo "vapid=$VAPID_OK"
          } > /tmp/receipt.txt
      - name: Record receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "checked_at=$TS"; cat /tmp/receipt.txt; } > /tmp/final.txt
          CONTENT=$(base64 -w0 /tmp/final.txt)
          PATH_NAME='deploy-receipts/canonical-preview-verification.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Verify canonical Worker preview' -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Verify canonical Worker preview' -f content="$CONTENT" -f branch=test
          fi
