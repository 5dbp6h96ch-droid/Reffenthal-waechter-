name: Deploy canonical rheinschiffer-test Worker

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/deploy-canonical-test-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety gate — exact canonical source and current live version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          GOOD='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          grep -q "confirmed_good_version=$GOOD" canonical-test-worker/ORIGIN.txt
          grep -q 'd1_database_id=51255b8b-b4f6-48f4-b630-82093749ea3a' canonical-test-worker/ORIGIN.txt
          test "$(sha256sum canonical-test-worker/src/worker.js | awk '{print $1}')" = 'e696e854ee76ee5b2d56fa3418c76ddcdc2a64ef7a29b66b6c9da8840ca794b1'
          test "$(sha256sum canonical-test-worker/public/app.js | awk '{print $1}')" = '45c6acbb3057204d18bd76a9a58db53262004edd4cb789e0540048e96e227ff8'
          jq -e '.name=="rheinschiffer-test" and .vars.APP_ENV=="test" and .d1_databases[0].database_id=="51255b8b-b4f6-48f4-b630-82093749ea3a"' canonical-test-worker/wrangler.jsonc >/dev/null
          jq -e '.id=="/" and .start_url=="/" and .scope=="/" and .display=="standalone"' canonical-test-worker/public/manifest.webmanifest >/dev/null
          grep -q "clients.matchAll({ type: 'window', includeUncontrolled: true })" canonical-test-worker/public/sw.js
          grep -q 'appClient.navigate(targetUrl)' canonical-test-worker/public/sw.js
          grep -q '"#/nfb"' canonical-test-worker/src/worker.js

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/deployments"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" > /tmp/before.json
          jq -e '.success==true' /tmp/before.json >/dev/null
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/before.json)
          test "$ACTIVE" = "$GOOD"
          echo "rollback_version=$GOOD" >> "$GITHUB_ENV"
          echo "before_version=$ACTIVE" >> "$GITHUB_ENV"

      - name: Dry-run immediately before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-test-worker
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/final-dry-run --config wrangler.jsonc
          test -s /tmp/final-dry-run/worker.js

      - name: Upload new version without changing traffic or triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE: /tmp/wrangler-output.jsonl
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-test-worker
          npx --yes wrangler@4 versions upload --config wrangler.jsonc --tag ios-pwa-clickfix-v1 --message 'TEST only: focus installed PWA and route WSV push to #/nfb'
          cd ..
          cat /tmp/wrangler-output.jsonl
          NEW_VERSION=$(jq -r 'select(.type=="version-upload") | .version_id // empty' /tmp/wrangler-output.jsonl | tail -n1)
          if [ -z "$NEW_VERSION" ]; then
            NEW_VERSION=$(npx --yes wrangler@4 versions list --name rheinschiffer-test --json --config canonical-test-worker/wrangler.jsonc | jq -r '.[] | select((.annotations["workers/tag"] // .tag // "")=="ios-pwa-clickfix-v1") | .id' | head -n1)
          fi
          test -n "$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Deploy uploaded version at 100 percent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${new_version}@100%" --name rheinschiffer-test --message 'TEST only: iOS PWA push click fix' -y --config canonical-test-worker/wrangler.jsonc

      - name: Live smoke tests
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          PASS=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/index /tmp/app /tmp/sw /tmp/manifest /tmp/vapid
            curl -fsSL "$BASE/" -o /tmp/index || true
            curl -fsSL "$BASE/app.js" -o /tmp/app || true
            curl -fsSL "$BASE/sw.js" -o /tmp/sw || true
            curl -fsSL "$BASE/manifest.webmanifest" -o /tmp/manifest || true
            curl -fsSL "$BASE/api/push/vapid-public-key" -o /tmp/vapid || true
            if grep -q 'R(h)einschiffer' /tmp/index 2>/dev/null \
              && grep -q 'rel="manifest" href="/manifest.webmanifest"' /tmp/index 2>/dev/null \
              && [ "$(sha256sum /tmp/app 2>/dev/null | awk '{print $1}')" = '45c6acbb3057204d18bd76a9a58db53262004edd4cb789e0540048e96e227ff8' ] \
              && grep -q "clients.matchAll({ type: 'window', includeUncontrolled: true })" /tmp/sw 2>/dev/null \
              && grep -q 'appClient.navigate(targetUrl)' /tmp/sw 2>/dev/null \
              && jq -e '.id=="/" and .scope=="/" and .display=="standalone"' /tmp/manifest >/dev/null 2>&1 \
              && jq -e '.configured==true and (.publicKey|type=="string")' /tmp/vapid >/dev/null 2>&1; then
              PASS=1
              break
            fi
            sleep 10
          done
          [ "$PASS" -eq 1 ]
          RC=$?
          [ "$RC" -eq 0 ] && STATUS=ok || STATUS=fail
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Automatic rollback if smoke test failed
        if: steps.smoke.outputs.status != 'ok'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Smoke test failed. Restoring ${rollback_version}."
          npx --yes wrangler@4 versions deploy "${rollback_version}@100%" --name rheinschiffer-test --message 'Automatic rollback after failed canonical test smoke check' -y --config canonical-test-worker/wrangler.jsonc
          exit 1

      - name: Verify Cloudflare reports the new version active
        if: steps.smoke.outputs.status == 'ok'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/deployments"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" > /tmp/after.json
          jq -e '.success==true' /tmp/after.json >/dev/null
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/after.json)
          test "$ACTIVE" = "$new_version"
          echo "after_version=$ACTIVE" >> "$GITHUB_ENV"

      - name: Record successful controlled deployment
        if: steps.smoke.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CONTENT=$(printf 'target=worker:rheinschiffer-test\nresult=ok\nbefore_version=%s\nafter_version=%s\nrollback_version=%s\ntag=ios-pwa-clickfix-v1\ndeployed_at=%s\nsource_commit=%s\n' "$before_version" "$after_version" "$rollback_version" "$TS" "$GITHUB_SHA" | base64 -w0)
          PATH_NAME='deploy-receipts/canonical-test-worker-deployment.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Deploy canonical test Worker click fix" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Deploy canonical test Worker click fix" -f content="$CONTENT" -f branch=test
          fi
