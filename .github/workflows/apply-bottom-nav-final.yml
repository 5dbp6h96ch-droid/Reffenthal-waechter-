name: Apply bottom nav final values

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/apply-bottom-nav-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v4

      - name: Apply exact editor values
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()

          # Exact requested bottom-navigation spacing.
          s = s.replace('paddingBottom: botPad + 1,', 'paddingBottom: 1,', 1)
          s = s.replace('paddingBottom: botPad,', 'paddingBottom: 1,', 1)

          # Exact requested icon size: 22 x 22 px.
          s = s.replace('width: 29, height: 29,', 'width: 22, height: 22,', 1)
          s = s.replace('width: 34, height: 24,', 'width: 22, height: 22,', 1)
          s = s.replace('name={icon}\n                  size={29}', 'name={icon}\n                  size={22}', 1)
          s = s.replace('name="log-out"\n              size={29}', 'name="log-out"\n              size={22}', 1)
          s = s.replace('name={icon}\n                  size={17}', 'name={icon}\n                  size={22}', 1)
          s = s.replace('name="log-out"\n              size={17}', 'name="log-out"\n              size={22}', 1)

          p.write_text(s)
          PY

      - name: Commit app change and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/components/OriginalHomeScreen.tsx
          git rm .github/workflows/apply-bottom-nav-final.yml
          git commit -m 'Apply bottom nav 22px icons and exact spacing'
          git push origin test
