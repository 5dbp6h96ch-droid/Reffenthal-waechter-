name: One-off gauge collapse fix

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Apply test-only UI fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()
          old = "onPress={() => selectGauge(g.id)}"
          new = "onPress={() => { selectGauge(g.id); setGaugeListOpen(false); }}"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one gauge selector handler, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/oneoff-gauge-collapse.yml

      - name: Commit and push test-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mobile/components/OriginalHomeScreen.tsx .github/workflows/oneoff-gauge-collapse.yml
          git commit -m "Fix test gauge selection collapse [skip ci]"
          git push origin test
