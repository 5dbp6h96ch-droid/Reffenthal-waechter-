name: Diagnose canonical Worker upload error detail

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/diagnose-canonical-version-upload-error.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Attempt inactive version upload
        id: upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          cd canonical-test-worker
          npx --yes wrangler@4 versions upload --config wrangler.jsonc --tag ios-pwa-clickfix-v1 --message 'TEST only: canonical iOS PWA click fix' >/tmp/upload.log 2>&1
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record redacted error detail
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.upload.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "checked_at=$TS"
            echo "upload_exit=${RC:-unknown}"
            echo 'wrangler_message:'
            tail -n 80 /tmp/upload.log 2>/dev/null \
              | sed -E 's/(SMTP_PASSWORD|VAPID_PRIVATE_KEY|VAPID_PUBLIC_KEY|VAPID_SUBJECT|SMTP_USER|SMTP_HOST)/[SECRET_BINDING]/g' \
              | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g'
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/canonical-version-upload-error-detail.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose canonical Worker upload error detail' -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose canonical Worker upload error detail' -f content="$CONTENT" -f branch=test
          fi
