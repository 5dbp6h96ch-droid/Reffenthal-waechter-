name: Inspect test Worker version

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-test-worker-version.yml'
  pull_request:
    branches:
      - test
    paths:
      - '.diagnostics/**'
      - '.github/workflows/inspect-test-worker-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Inspect push API read-only
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/public-app
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          : > .diagnostics/public-app/push-api-report.txt
          probe() {
            method="$1"; path="$2"
            echo "=== $method $path ===" >> .diagnostics/public-app/push-api-report.txt
            curl -sS -i -X "$method" \
              -A 'Mozilla/5.0' \
              -H 'Accept: application/json' \
              -H 'x-rheinschiffer-device-id: diagnostic-read-only' \
              "$BASE$path" \
              | sed -E 's/^(set-cookie:).*/\1 [redacted]/I' \
              >> .diagnostics/public-app/push-api-report.txt
            echo >> .diagnostics/public-app/push-api-report.txt
          }
          probe GET /api/push/vapid-public-key
          probe GET /api/auth/me
          probe GET /api/settings
          probe OPTIONS /api/push/subscribe
          probe GET /api/push/subscribe
          probe OPTIONS /api/push/unsubscribe
          probe GET /api/push/unsubscribe

      - name: Commit push API inspection to test branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diagnostics/public-app/push-api-report.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "chore(test): save read-only push API inspection [skip ci]"
          git push origin HEAD:test
