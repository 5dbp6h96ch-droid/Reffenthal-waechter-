name: Inspect test Worker version

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-test-worker-version.yml'
  pull_request:
    branches:
      - test
    paths:
      - '.diagnostics/**'
      - '.github/workflows/inspect-test-worker-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Inspect push POST validation safely
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/public-app
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          : > .diagnostics/public-app/push-post-validation.txt
          probe_post() {
            path="$1"; body="$2"
            echo "=== POST $path ===" >> .diagnostics/public-app/push-post-validation.txt
            curl -sS -i -X POST \
              -A 'Mozilla/5.0' \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'x-rheinschiffer-device-id: diagnostic-invalid-payload' \
              --data "$body" \
              "$BASE$path" \
              | sed -E 's/^(set-cookie:).*/\1 [redacted]/I' \
              >> .diagnostics/public-app/push-post-validation.txt
            echo >> .diagnostics/public-app/push-post-validation.txt
          }
          probe_post /api/push/subscribe '{}'
          probe_post /api/push/unsubscribe '{}'
          echo "=== GET diagnostic settings after invalid POSTs ===" >> .diagnostics/public-app/push-post-validation.txt
          curl -sS -i \
            -A 'Mozilla/5.0' \
            -H 'Accept: application/json' \
            -H 'x-rheinschiffer-device-id: diagnostic-invalid-payload' \
            "$BASE/api/settings" \
            | sed -E 's/^(set-cookie:).*/\1 [redacted]/I' \
            >> .diagnostics/public-app/push-post-validation.txt

      - name: Commit push POST validation to test branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diagnostics/public-app/push-post-validation.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "chore(test): save push POST validation diagnostics [skip ci]"
          git push origin HEAD:test
