name: TEST patch Rhein forecast

on:
  push:
    branches: [test]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-rhein-forecast]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
      - name: Patch forecast UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/app/index.tsx')
          s = p.read_text()
          if "@/components/RheinGaugeForecast" not in s:
              s = s.replace(
                  "import { GaugeAlertRow } from '@/components/GaugeAlertRow';",
                  "import { GaugeAlertRow } from '@/components/GaugeAlertRow';\nimport RheinGaugeForecast from '@/components/RheinGaugeForecast';",
                  1,
              )
          start = s.index('            {/* 1. Vorhersage */}')
          divider = s.index('            <View style={menuDivider} />\n\n            {/* 2. WSV', start)
          replacement = '''            {/* 1. Vorhersage */}
            <>
              <TouchableOpacity
                onPress={() => setHvzOpen(o => !o)}
                activeOpacity={0.7}
                style={menuRow}
              >
                <MenuRowLeft icon="trending-up" label="Vorhersage" />
                <View style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}>
                  <TouchableOpacity
                    onPress={() => {
                      if (selectedGauge?.pegel_uuid) {
                        void Linking.openURL(`https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${selectedGauge.pegel_uuid}.json?includeForecastTimeseries=true`);
                      }
                    }}
                    activeOpacity={0.7}
                    hitSlop={{ top: 8, bottom: 8, left: 8, right: 8 }}
                    style={{ flexDirection: 'row', alignItems: 'center', gap: 3 }}
                  >
                    <Text style={{ fontSize: 11, fontFamily: 'SpaceGrotesk_400Regular', color: colors.mutedForeground }}>
                      PEGELONLINE
                    </Text>
                    <Feather name="external-link" size={11} color={colors.mutedForeground} />
                  </TouchableOpacity>
                  <Feather name={hvzOpen ? 'chevron-up' : 'chevron-right'} size={16} color={colors.mutedForeground} />
                </View>
              </TouchableOpacity>

              {hvzOpen && (
                <View style={{ paddingHorizontal: 16, paddingBottom: 16, paddingTop: 8 }}>
                  <RheinGaugeForecast
                    stationId={selectedGauge?.pegel_uuid ?? null}
                    stationName={selectedGauge?.name ?? null}
                  />
                </View>
              )}
            </>

'''
          s = s[:start] + replacement + s[divider:]
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/app/index.tsx artifacts/mobile/components/RheinGaugeForecast.tsx
          git rm .github/workflows/patch-rhein-forecast.yml
          git commit -m 'TEST: Vorhersage je ausgewaehltem Rheinpegel [auto-rhein-forecast]'
          git push origin HEAD:test
