name: Diagnose active rheinschiffer-test backend hash

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/diagnose-active-worker-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Download active Worker and compare backend hash
        id: inspect
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/rheinschiffer-test/deployments" > /tmp/deployments.json
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/deployments.json)
          URL="$API/workers/scripts/rheinschiffer-test"
          curl -fsSL -D /tmp/headers.txt -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" -o /tmp/body.bin
          CURL_RC=$?
          CONTENT_TYPE=$(grep -i '^content-type:' /tmp/headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs)
          export CONTENT_TYPE
          python3 - <<'PY'
          import os
          from email.parser import BytesParser
          from email.policy import default
          body=open('/tmp/body.bin','rb').read()
          ct=os.environ.get('CONTENT_TYPE','')
          out=b''
          if 'multipart/' in ct:
              msg=BytesParser(policy=default).parsebytes((f'MIME-Version: 1.0\r\nContent-Type: {ct}\r\n\r\n').encode()+body)
              for part in msg.iter_parts():
                  name=part.get_param('name', header='content-disposition') or ''
                  if name=='worker.js':
                      out=part.get_payload(decode=True) or b''
                      break
          else:
              out=body
          open('/tmp/worker.js','wb').write(out)
          PY
          HASH=$(sha256sum /tmp/worker.js | awk '{print $1}')
          BYTES=$(wc -c < /tmp/worker.js | tr -d ' ')
          EXPECTED='e696e854ee76ee5b2d56fa3418c76ddcdc2a64ef7a29b66b6c9da8840ca794b1'
          MATCH=no; [ "$HASH" = "$EXPECTED" ] && MATCH=yes
          {
            echo "active_version=$ACTIVE"
            echo "curl_exit=$CURL_RC"
            echo "content_type=$CONTENT_TYPE"
            echo "backend_bytes=$BYTES"
            echo "backend_sha=$HASH"
            echo "backend_matches_canonical=$MATCH"
          } > /tmp/backend.txt
          cat /tmp/backend.txt
          exit 0
      - name: Record receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "checked_at=$TS"; cat /tmp/backend.txt 2>/dev/null || true; } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/canonical-active-backend-diagnosis.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose active canonical backend' -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose active canonical backend' -f content="$CONTENT" -f branch=test
          fi
