name: Apply production pegel card to test

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/oneoff-gauge-ui.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Match production pegel card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()
          old = """            <Text style={{
              fontSize: 9, fontFamily: 'SpaceGrotesk_700Bold',
              color: '#FFFFFF', letterSpacing: 2,
            }}>"""
          new = """            <Text style={{
              fontSize: 10, fontFamily: 'SpaceGrotesk_700Bold',
              color: '#FFFFFF', letterSpacing: 2,
            }}>"""
          if old not in s:
              raise SystemExit('Expected test status badge block not found; aborting without broad replacements')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit app change and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/components/OriginalHomeScreen.tsx
          git rm .github/workflows/oneoff-gauge-ui.yml
          git commit -m 'Test: match production pegel card [skip ci]'
          git push origin test

      - name: Deploy updated test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-test.yml --ref test
