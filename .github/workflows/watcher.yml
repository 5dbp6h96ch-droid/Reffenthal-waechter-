name: Reffenthal-Wächter

on:
  # Alle 30 Minuten automatisch ausführen
  schedule:
    - cron: "17,47 * * * *"

  # Manuell ausführen über GitHub Actions UI
  workflow_dispatch:
    inputs:
      push_test:
        description: "Nur für Push-Test: alle drei Ereignistypen senden"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Verhindert parallele Läufe – zweiter Run wartet, bis der erste fertig ist
concurrency:
  group: reffenthal-waechter
  cancel-in-progress: false

jobs:
  watch:
    name: Wächter ausführen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r reffenthal-waechter/requirements.txt

      - name: Wächter ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://azssnqabyefqplnoehty.supabase.co
        run: |
          cd reffenthal-waechter && python watcher.py

      - name: Test Pegeländerung
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test == true }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://azssnqabyefqplnoehty.supabase.co/functions/v1/send-event-push" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            --data '{"event_type":"gauge_change","title":"Pegeländerung","body":"TEST – Pegeländerung","url":"/","gauge_id":"SPEYER","threshold_cm":225}'

      - name: Test Pegelwarnung
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test == true }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://azssnqabyefqplnoehty.supabase.co/functions/v1/send-event-push" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            --data '{"event_type":"threshold_crossed","title":"Pegelwarnung","body":"TEST – Schwellenunterschreitung","url":"/","gauge_id":"SPEYER","threshold_cm":225}'

      - name: Test WSV-Meldung
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test == true }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://azssnqabyefqplnoehty.supabase.co/functions/v1/send-event-push" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            --data '{"event_type":"wsv_news","title":"Neue WSV-Meldung","body":"TEST – Neue WSV-Meldung","url":"/","gauge_id":"SPEYER","threshold_cm":225}'

      - name: Zustand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            reffenthal-waechter/state.json \
            reffenthal-waechter/seen.json \
            reffenthal-waechter/clubs_seen.json \
            reffenthal-waechter/run_status.json \
            reffenthal-waechter/nfb.json \
            reffenthal-waechter/nfb-state.json \
            reffenthal-waechter/mck.json
          git diff --staged --quiet || git commit -m "chore: Wächter-Zustand aktualisiert [skip ci]"
          git push
