name: Restore confirmed test Worker

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/restore-test-worker.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout known-good rollback
        uses: actions/checkout@v4
        with:
          ref: backup/after-marina-map-complete-2026-08-21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build rollback test app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          cd artifacts/mobile
          pnpm exec expo export --platform web --output-dir dist

      - name: Restore PWA assets
        run: |
          DIST=artifacts/mobile/dist
          VERSION=rollback-after-marina-2026-08-21
          sed "s/__CACHE_VERSION__/${VERSION}/g" artifacts/mobile/sw-template.js > "$DIST/sw.js"
          if [ -f artifacts/mobile/public/push-sw.js ]; then cp artifacts/mobile/public/push-sw.js "$DIST/push-sw.js"; fi
          cp artifacts/mobile/public/icon-192.png "$DIST/icon-192.png"
          cp artifacts/mobile/public/icon-512.png "$DIST/icon-512.png"
          cp artifacts/mobile/public/apple-touch-icon.png "$DIST/apple-touch-icon.png"
          cp artifacts/mobile/public/favicon.png "$DIST/favicon.png"
          cp artifacts/mobile/public/manifest.webmanifest "$DIST/manifest.webmanifest"
          cp artifacts/mobile/public/leaflet.css "$DIST/leaflet.css"
          cp artifacts/mobile/public/test-layout.html "$DIST/test-layout.html"

      - name: Restore worker from rollback build only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy \
            --name rheinschiffer-test \
            --compatibility-date 2026-08-21 \
            --assets artifacts/mobile/dist
