name: Roll back confirmed test Worker one version

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/restore-test-worker.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Roll back rheinschiffer-test by one Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 rollback \
            --name rheinschiffer-test \
            --message "Rollback one more version to recover pre-push test site"
