name: Reffenthal-Wächter (Test)

# Manueller Testlauf gegen das TEST-Supabase-Projekt.
# Nutzt ausschließlich das GitHub Environment "test" – Production-Secrets
# werden NICHT verwendet, es wird kein Zustand committet und kein
# Telegram gesendet. Web-Push geht nur an das Test-Projekt.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-test:
    name: Wächter-Testlauf (nur Test-Supabase)
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r reffenthal-waechter/requirements.txt

      - name: Wächter ausführen (nur Test-Ziel)
        env:
          # Bewusst NUR Test-Supabase: kein TELEGRAM_BOT_TOKEN, keine
          # Production-Keys, kein GITHUB_TOKEN → kein State-Commit.
          # Der Testmodus erlaubt Web-Push bei einem relevanten Wächter-Event
          # auch ohne Telegram-Zugangsdaten.
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          WEBPUSH_WITHOUT_TELEGRAM: "1"
        run: |
          cd reffenthal-waechter && python watcher.py

      - name: Echter Pegelwarnungs-Pfad (nur Test-Supabase)
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          WEBPUSH_WITHOUT_TELEGRAM: "1"
        run: |
          cd reffenthal-waechter
          python - <<'PY'
          import watcher
          import gauges
          import pegel

          GAUGE_ID = "57090802-c51a-4d09-8340-b4453cd0e1f5"

          # Nur der Messwert wird für diesen Test kontrolliert. Die eigentliche
          # Alarm-/Push-Logik läuft unverändert durch watcher.run_pegel().
          gauges.load_watched_gauges = lambda: [{
              "uuid": GAUGE_ID,
              "name": "Mannheim",
              "threshold_cm": 76,
              "thresholds": [76],
          }]
          pegel.fetch_pegel = lambda uuid: {
              "value_cm": 75,
              "timestamp": "2026-08-16T17:35:00+02:00",
          }

          state = {
              "gauges": {
                  GAUGE_ID: {
                      "last_pegel_cm": 101,
                      "last_pegel_time": "2026-08-16T17:30:00+02:00",
                  }
              }
          }

          result = watcher.run_pegel(state)
          print("Echter Pegelwarnungs-Pfad erfolgreich durchlaufen.")
          print(result)
          PY
