name: Reffenthal-Wächter (Test)

# Manueller Testlauf gegen das TEST-Supabase-Projekt.
# Nutzt ausschließlich das GitHub Environment "test" – Production-Secrets
# werden NICHT verwendet, es wird kein Zustand committet und kein
# Telegram gesendet. Web-Push geht nur an das Test-Projekt.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-test:
    name: Wächter-Testlauf (nur Test-Supabase)
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r reffenthal-waechter/requirements.txt

      - name: Wächter ausführen (nur Test-Ziel)
        env:
          # Bewusst NUR Test-Supabase: kein TELEGRAM_BOT_TOKEN, keine
          # Production-Keys, kein GITHUB_TOKEN → kein State-Commit.
          # Der Testmodus erlaubt Web-Push bei einem relevanten Wächter-Event
          # auch ohne Telegram-Zugangsdaten.
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          WEBPUSH_WITHOUT_TELEGRAM: "1"
        run: |
          cd reffenthal-waechter && python watcher.py

      - name: Pegelwarnung-Test (kompletter Alert-Pfad, nur Test-Supabase)
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          WEBPUSH_WITHOUT_TELEGRAM: "1"
        run: |
          cd reffenthal-waechter
          python - <<'PY'
          from telegram import send_message

          meta = {
              "event_type": "threshold_crossed",
              "title": "Pegelwarnung",
              "body": "TESTALARM – Pegel Mannheim\nAktuell: 76 cm\nUnter Schwelle: 100 cm",
              "url": "/",
              "gauge_id": "TEST-MANNHEIM",
              "gauge_name": "Mannheim",
              "current_cm": 76,
              "previous_cm": 101,
              "threshold_cm": 100,
          }
          ok = send_message("TESTALARM: Pegelwarnung Mannheim", push_meta=meta)
          if not ok:
              raise SystemExit("Pegelwarnung-Test konnte nicht gesendet werden")
          print("Pegelwarnung-Test erfolgreich ausgelöst.")
          PY
