name: test admin link

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - name: Patch Konto
        run: |
          python3 -c 'from pathlib import Path; p=Path("artifacts/mobile/components/OriginalHomeScreen.tsx"); s=p.read_text(encoding="utf-8"); marker="          {/* Abmelden */}"; block="          {user.app_metadata?.role === \\"admin\\" && (<TouchableOpacity activeOpacity={0.75} onPress={() => { if (Platform.OS === \\"web\\" && typeof window !== \\"undefined\\") { window.location.assign(\\"/admin\\"); } else { Linking.openURL(\\"https://rheinschiffer-test.pages.dev/admin\\"); } }} style={{ flexDirection: \\"row\\", alignItems: \\"center\\", justifyContent: \\"space-between\\", paddingVertical: 14, paddingHorizontal: 16, borderRadius: 10, borderWidth: 1, borderColor: colors.primary + \\"45\\", backgroundColor: colors.primary + \\"10\\" }}><View style={{ flexDirection: \\"row\\", alignItems: \\"center\\", gap: 10 }}><Feather name=\\"send\\" size={16} color={colors.primary} /><Text style={{ fontSize: 14, fontFamily: \\"SpaceGrotesk_600SemiBold\\", color: colors.primary }}>Admin · Push senden</Text></View><Feather name=\\"chevron-right\\" size={16} color={colors.primary} /></TouchableOpacity>)}\\n\\n"; s=s if "Admin · Push senden" in s else s.replace(marker, block+marker, 1); p.write_text(s, encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mobile/components/OriginalHomeScreen.tsx
          git rm .github/workflows/test-add-admin-link.yml .github/workflows/oneoff-gauge-ui.yml TEST-ADMIN-LINK-TRIGGER.txt
          git commit -m "test: Admin-Push im Konto verlinken [skip ci]"
          git push origin test
