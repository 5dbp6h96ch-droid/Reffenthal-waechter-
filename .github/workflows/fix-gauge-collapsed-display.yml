name: Fix test gauge collapsed display

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Apply test-only gauge selection fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()

          # Selecting a gauge must immediately collapse the list.
          old_handler = "onPress={() => selectGauge(g.id)}"
          new_handler = "onPress={() => { selectGauge(g.id); setGaugeListOpen(false); }}"
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)

          # Keep the selected gauge visible when the list is collapsed.
          marker = "        </TouchableOpacity>\n\n        {gaugeListOpen && ("
          selected_block = """        </TouchableOpacity>

        {!gaugeListOpen && selectedGauge && (
          <View style={{
            flexDirection: 'row', alignItems: 'center',
            justifyContent: 'space-between',
            paddingHorizontal: 16, paddingVertical: 14,
            backgroundColor: colors.card, borderRadius: 12,
            borderWidth: 1, borderColor: colors.border,
          }}>
            <View style={{ flexDirection: 'row', alignItems: 'center', gap: 12 }}>
              <View style={{
                width: 32, height: 32, borderRadius: 16,
                backgroundColor: colors.primary + '20',
                alignItems: 'center', justifyContent: 'center',
              }}>
                <Feather name=\"anchor\" size={14} color={colors.primary} />
              </View>
              <View style={{ gap: 1 }}>
                <Text style={{
                  fontSize: 15, fontFamily: 'SpaceGrotesk_700Bold',
                  color: colors.primary,
                }}>
                  {selectedGauge.name}
                </Text>
                {(selectedGauge.river != null || selectedGauge.river_km != null) && (
                  <Text style={{
                    fontSize: 12, fontFamily: 'SpaceGrotesk_400Regular',
                    color: colors.mutedForeground,
                  }}>
                    {[selectedGauge.river, selectedGauge.river_km != null ? `km ${selectedGauge.river_km}` : null]
                      .filter(Boolean).join(' · ')}
                  </Text>
                )}
              </View>
            </View>
            <Feather name=\"check\" size={18} color={colors.primary} />
          </View>
        )}

        {gaugeListOpen && ("""
          if marker in s:
              s = s.replace(marker, selected_block, 1)

          # Defensive synchronization, inserted AFTER selectedGauge is declared
          # so TypeScript never sees a use-before-declaration.
          if 'TEST: Selecting a gauge always collapses' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if 'const selectedGauge =' in line:
                      effect = """\n  // TEST: Selecting a gauge always collapses the 'Meine Pegel' list.\n  useEffect(() => {\n    if (selectedGauge) setGaugeListOpen(false);\n  }, [selectedGauge]);\n"""
                      lines.insert(i + 1, effect)
                      s = ''.join(lines)
                      break
              else:
                  raise SystemExit('selectedGauge declaration not found')

          if 'TEST: Selecting a gauge always collapses' not in s:
              raise SystemExit('Selection collapse synchronization was not inserted')
          if '{!gaugeListOpen && selectedGauge && (' not in s:
              raise SystemExit('Collapsed selected-gauge display is missing')

          p.write_text(s)
          PY

      - name: Verify test web build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec expo export --platform web --output-dir dist

      - name: Commit test-only change and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mobile/components/OriginalHomeScreen.tsx .github/workflows/fix-gauge-collapsed-display.yml
          git commit -m "Fix test Meine Pegel selection collapse [skip ci]"
          git push origin test
          git rm .github/workflows/fix-gauge-collapsed-display.yml
          git commit -m "Remove one-off gauge selection workflow [skip ci]"
          git push origin test
