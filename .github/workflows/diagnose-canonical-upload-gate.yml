name: Diagnose canonical test Worker upload gate

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/diagnose-canonical-upload-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Check every safety condition without upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          GOOD='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          OUT=/tmp/gate.txt
          : > "$OUT"
          check() { name="$1"; shift; "$@" >/dev/null 2>&1; rc=$?; if [ $rc -eq 0 ]; then echo "$name=ok" >> "$OUT"; else echo "$name=fail" >> "$OUT"; fi; }

          check origin_good grep -q "confirmed_good_version=$GOOD" canonical-test-worker/ORIGIN.txt
          ACTUAL_WORKER=$(sha256sum canonical-test-worker/src/worker.js 2>/dev/null | awk '{print $1}')
          echo "worker_sha=$ACTUAL_WORKER" >> "$OUT"
          [ "$ACTUAL_WORKER" = 'e696e854ee76ee5b2d56fa3418c76ddcdc2a64ef7a29b66b6c9da8840ca794b1' ]; [ $? -eq 0 ] && echo worker_sha_match=ok >> "$OUT" || echo worker_sha_match=fail >> "$OUT"
          ACTUAL_APP=$(sha256sum canonical-test-worker/public/app.js 2>/dev/null | awk '{print $1}')
          echo "app_sha=$ACTUAL_APP" >> "$OUT"
          [ "$ACTUAL_APP" = '45c6acbb3057204d18bd76a9a58db53262004edd4cb789e0540048e96e227ff8' ]; [ $? -eq 0 ] && echo app_sha_match=ok >> "$OUT" || echo app_sha_match=fail >> "$OUT"

          jq -e '.name=="rheinschiffer-test" and .vars.APP_ENV=="test" and .d1_databases[0].database_id=="51255b8b-b4f6-48f4-b630-82093749ea3a"' canonical-test-worker/wrangler.jsonc >/dev/null 2>&1
          [ $? -eq 0 ] && echo wrangler_identity=ok >> "$OUT" || echo wrangler_identity=fail >> "$OUT"
          jq -e '.id=="/" and .scope=="/" and .display=="standalone"' canonical-test-worker/public/manifest.webmanifest >/dev/null 2>&1
          [ $? -eq 0 ] && echo manifest=ok >> "$OUT" || echo manifest=fail >> "$OUT"
          grep -q "clients.matchAll({ type: 'window', includeUncontrolled: true })" canonical-test-worker/public/sw.js
          [ $? -eq 0 ] && echo sw_matchall=ok >> "$OUT" || echo sw_matchall=fail >> "$OUT"
          grep -q 'appClient.navigate(targetUrl)' canonical-test-worker/public/sw.js
          [ $? -eq 0 ] && echo sw_navigate=ok >> "$OUT" || echo sw_navigate=fail >> "$OUT"

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/deployments"
          HTTP=$(curl -sS -o /tmp/deployments.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API")
          echo "cloudflare_http=$HTTP" >> "$OUT"
          SUCCESS=$(jq -r '.success // false' /tmp/deployments.json 2>/dev/null)
          echo "cloudflare_success=$SUCCESS" >> "$OUT"
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/deployments.json 2>/dev/null)
          echo "active_version=$ACTIVE" >> "$OUT"
          [ "$ACTIVE" = "$GOOD" ]; [ $? -eq 0 ] && echo active_is_good=ok >> "$OUT" || echo active_is_good=fail >> "$OUT"
          cat "$OUT"

      - name: Record diagnostic receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "checked_at=$TS"; cat /tmp/gate.txt; } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/canonical-upload-gate-diagnosis.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose canonical Worker upload gate' -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose canonical Worker upload gate' -f content="$CONTENT" -f branch=test
          fi
