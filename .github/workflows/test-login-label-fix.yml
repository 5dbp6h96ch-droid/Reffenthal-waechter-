name: Temporary test login label fix

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
      - name: Change guest login button text
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''            Anmelden\n          </Text>'''
          new = '''            Alle Funktionen freischalten\n          </Text>'''
          if old not in s:
              raise SystemExit('Guest login button text not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mobile/components/OriginalHomeScreen.tsx
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "test: rename guest login button"
          git push origin test
