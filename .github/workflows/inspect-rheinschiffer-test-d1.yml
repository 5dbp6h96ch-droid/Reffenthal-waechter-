name: Inspect canonical rheinschiffer-test binding identifiers

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-d1.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read non-sensitive binding identifiers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/versions/${VERSION}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$URL" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null
          jq '{
            d1:(.result.resources.bindings[] | select(.type=="d1" and .name=="DB") | {name,type,id,database_id,database_name}),
            app_env:(.result.resources.bindings[] | select(.type=="plain_text" and .name=="APP_ENV") | {name,type,text,value})
          }' /tmp/version.json > /tmp/safe.json
          cat /tmp/safe.json

      - name: Record safe binding identifiers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo 'target=worker:rheinschiffer-test'
            echo 'confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo "inspected_at=${TS}"
            cat /tmp/safe.json
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-safe-binding-identifiers.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test safe binding identifiers" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test safe binding identifiers" -f content="$CONTENT" -f branch=test
          fi
