name: Inspect canonical rheinschiffer-test D1 schema

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-d1.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve D1 binding and read schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          VURL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/versions/${VERSION}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$VURL" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null
          DB_ID=$(jq -r '.result.resources.bindings[] | select(.type=="d1" and .name=="DB") | (.id // .database_id // "")' /tmp/version.json)
          test -n "$DB_ID"
          QURL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"
          jq -n --arg sql "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" '{sql:$sql}' > /tmp/query.json
          curl -fsS -X POST "$QURL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/query.json > /tmp/result.json
          jq -e '.success == true' /tmp/result.json >/dev/null
          jq '[.result[]?.results[]? | {name, sql}]' /tmp/result.json > /tmp/schema.json
          cat /tmp/schema.json

      - name: Record schema only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo 'target=worker:rheinschiffer-test'
            echo 'confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo "inspected_at=${TS}"
            cat /tmp/schema.json
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-d1-schema.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test D1 schema" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test D1 schema" -f content="$CONTENT" -f branch=test
          fi
