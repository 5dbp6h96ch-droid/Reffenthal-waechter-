name: Inspect canonical rheinschiffer-test D1 schema

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/inspect-rheinschiffer-test-d1.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose D1 binding and schema
        id: diag
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          VERSION='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          VURL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/versions/${VERSION}"
          STATUS='fail'
          REASON='unknown'
          : > /tmp/schema.json
          : > /tmp/binding.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$VURL" > /tmp/version.json
          RC=$?
          if [ "$RC" -ne 0 ]; then
            REASON='version_fetch_failed'
          elif ! jq -e '.success == true' /tmp/version.json >/dev/null 2>&1; then
            REASON='version_api_unsuccessful'
          else
            jq '.result.resources.bindings[] | select(.type=="d1" and .name=="DB") | {name,type,keys:(keys)}' /tmp/version.json > /tmp/binding.json
            DB_ID=$(jq -r '.result.resources.bindings[] | select(.type=="d1" and .name=="DB") | (.id // .database_id // .namespace // "")' /tmp/version.json | head -n1)
            if [ -z "$DB_ID" ]; then
              REASON='d1_identifier_not_exposed'
            else
              QURL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"
              jq -n --arg sql "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" '{sql:$sql}' > /tmp/query.json
              curl -fsS -X POST "$QURL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/query.json > /tmp/result.json
              QRC=$?
              if [ "$QRC" -ne 0 ]; then
                REASON='d1_query_http_failed'
              elif ! jq -e '.success == true' /tmp/result.json >/dev/null 2>&1; then
                REASON='d1_query_api_unsuccessful'
              else
                jq '[.result[]?.results[]? | {name, sql}]' /tmp/result.json > /tmp/schema.json
                STATUS='ok'
                REASON='ok'
              fi
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record safe D1 diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diag.outputs.status }}
          REASON: ${{ steps.diag.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo 'target=worker:rheinschiffer-test'
            echo 'confirmed_good_version=57cd69f3-d291-465f-b451-dbd8b4e46c88'
            echo "status=${STATUS}"
            echo "reason=${REASON}"
            echo "inspected_at=${TS}"
            echo 'd1_binding_structure:'
            cat /tmp/binding.json
            echo 'schema:'
            cat /tmp/schema.json
          } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/test-d1-schema.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test D1 diagnosis" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Record canonical test D1 diagnosis" -f content="$CONTENT" -f branch=test
          fi
