name: TEST wire Rhein preferences

on:
  push:
    branches: [test]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-rhein-preferences]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch test Preferences
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/mobile/app/index.tsx')
          s = p.read_text()
          if "@/components/RheinGaugePreferences" not in s:
              s = s.replace(
                  "import { GaugeAlertRow } from '@/components/GaugeAlertRow';",
                  "import { GaugeAlertRow } from '@/components/GaugeAlertRow';\nimport RheinGaugePreferences from '@/components/RheinGaugePreferences';",
                  1,
              )
          start = s.index('  // ── PREFERENCES-TAB ───────────────────────────────────────────────────────')
          end = s.index('  // ── HELP-TAB ─────────────────────────────────────────────────────────────', start)
          replacement = '''  // ── PREFERENCES-TAB ───────────────────────────────────────────────────────
  const renderPreferences = () => (
    <ScrollView
      style={{ flex: 1 }}
      contentContainerStyle={{
        padding: CARD_PADDING,
        paddingTop: topPad + CARD_PADDING,
        paddingBottom: botPad + BOTTOM_NAV_HEIGHT + 24,
        gap: 20,
      }}
    >
      <Text style={{
        fontSize: 24, fontFamily: 'SpaceGrotesk_700Bold',
        color: colors.foreground,
      }}>
        Preferences
      </Text>

      <RheinGaugePreferences userId={user?.id ?? null} />

      {/* MEINE PEGELWARNUNGEN */}
      <View style={{ gap: 10 }}>
        <Text style={{
          fontSize: 11, fontFamily: 'SpaceGrotesk_600SemiBold',
          color: colors.mutedForeground,
          letterSpacing: 2, textTransform: 'uppercase',
        }}>
          Meine Pegelwarnungen
        </Text>
        {user == null ? (
          <TouchableOpacity
            activeOpacity={0.8}
            onPress={() => handleTabPress('konto')}
            style={{
              flexDirection: 'row', alignItems: 'center', gap: 12,
              backgroundColor: colors.card, borderRadius: 12, borderWidth: 1,
              borderColor: colors.primary + '30', paddingHorizontal: 16, paddingVertical: 14,
            }}
          >
            <View style={{
              width: 34, height: 34, borderRadius: 17, backgroundColor: colors.primary + '15',
              alignItems: 'center', justifyContent: 'center',
            }}>
              <Feather name="lock" size={15} color={colors.primary} />
            </View>
            <View style={{ flex: 1 }}>
              <Text style={{ fontSize: 14, fontFamily: 'SpaceGrotesk_600SemiBold', color: colors.foreground }}>
                Anmeldung erforderlich
              </Text>
              <Text style={{ fontSize: 12, fontFamily: 'SpaceGrotesk_400Regular', color: colors.mutedForeground, marginTop: 1 }}>
                Persönliche Schwellen nach Login verfügbar
              </Text>
            </View>
            <Feather name="chevron-right" size={16} color={colors.primary} />
          </TouchableOpacity>
        ) : gauges.length === 0 ? (
          <ActivityIndicator size="small" color={colors.primary} style={{ alignSelf: 'flex-start' }} />
        ) : (
          <View style={{ gap: 8 }}>
            {gauges.map(g => (
              <GaugeAlertRow
                key={g.id}
                gauge={g}
                setting={getGaugeSetting(g.id)}
                onToggle={async (enabled) => updateGaugeSetting(g.id, { alert_enabled: enabled })}
                onSaveThreshold={async (cm) => updateGaugeSetting(g.id, { alert_threshold_cm: cm })}
              />
            ))}
          </View>
        )}
      </View>
    </ScrollView>
  );

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/app/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'TEST: Rhein-Preferences verdrahten [auto-rhein-preferences]'
          git push origin HEAD:test
