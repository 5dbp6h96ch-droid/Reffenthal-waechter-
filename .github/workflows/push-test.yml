name: Push-Test

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '.github/push-test-trigger.txt'
      - '.github/workflows/push-test.yml'

permissions:
  contents: read

jobs:
  push-test:
    name: Web-Push Test
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Test-Push nur an Test-Supabase senden
        run: |
          curl --fail-with-body -sS -X POST \
            "https://azssnqabyefqplnoehty.supabase.co/functions/v1/send-event-push" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.TEST_SUPABASE_SECRET_KEY }}" \
            --data '{"event_type":"test","title":"R(h)einschiffer Test","body":"Push-Test aus der Testumgebung erfolgreich ausgelöst.","url":"/#/einstellungen"}'
