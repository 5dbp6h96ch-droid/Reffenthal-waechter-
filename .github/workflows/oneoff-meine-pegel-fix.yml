name: One-off Meine Pegel fix

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Apply test-only fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()

          old = 'onPress={() => selectGauge(g.id)}'
          new = 'onPress={() => { selectGauge(g.id); setGaugeListOpen(false); }}'
          if old in s:
              s = s.replace(old, new, 1)

          if 'TEST: selected gauge closes the list' not in s:
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if 'const selectedGauge =' in line:
                      lines.insert(i + 1, "\n  // TEST: selected gauge closes the list\n  useEffect(() => {\n    if (selectedGauge) setGaugeListOpen(false);\n  }, [selectedGauge]);\n")
                      s = ''.join(lines)
                      break
              else:
                  raise SystemExit('selectedGauge declaration not found')

          if '{!gaugeListOpen && selectedGauge && (' not in s:
              raise SystemExit('collapsed selected-gauge display is missing')

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-meine-pegel-fix.yml
          git add artifacts/mobile/components/OriginalHomeScreen.tsx
          git commit -m "Fix test Meine Pegel selection collapse [skip ci]"
          git push origin test
