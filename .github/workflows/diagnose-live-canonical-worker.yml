name: Diagnose live canonical rheinschiffer-test Worker

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/diagnose-live-canonical-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live worker without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rheinschiffer-test.5dbp6h96ch.workers.dev'
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/rheinschiffer-test/deployments"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" > /tmp/deployments.json
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/deployments.json)
          curl -fsSL "$BASE/" -o /tmp/index
          curl -fsSL "$BASE/app.js" -o /tmp/app
          curl -fsSL "$BASE/sw.js" -o /tmp/sw
          curl -fsSL "$BASE/manifest.webmanifest" -o /tmp/manifest || true
          curl -fsSL "$BASE/api/push/vapid-public-key" -o /tmp/vapid
          {
            echo "active_version=$ACTIVE"
            echo "index_has_manifest=$(grep -q 'rel=\"manifest\" href=\"/manifest.webmanifest\"' /tmp/index && echo yes || echo no)"
            echo "app_sha=$(sha256sum /tmp/app | awk '{print $1}')"
            echo "sw_sha=$(sha256sum /tmp/sw | awk '{print $1}')"
            echo "sw_matchall=$(grep -q \"clients.matchAll({ type: 'window', includeUncontrolled: true })\" /tmp/sw && echo yes || echo no)"
            echo "sw_navigate=$(grep -q 'appClient.navigate(targetUrl)' /tmp/sw && echo yes || echo no)"
            echo "manifest_ok=$(jq -e '.id==\"/\" and .scope==\"/\" and .display==\"standalone\"' /tmp/manifest >/dev/null 2>&1 && echo yes || echo no)"
            echo "vapid_configured=$(jq -r '.configured // false' /tmp/vapid)"
          } > /tmp/live.txt
          cat /tmp/live.txt
      - name: Record receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "checked_at=$TS"; cat /tmp/live.txt; } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/canonical-live-worker-diagnosis.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose live canonical test Worker' -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Diagnose live canonical test Worker' -f content="$CONTENT" -f branch=test
          fi
