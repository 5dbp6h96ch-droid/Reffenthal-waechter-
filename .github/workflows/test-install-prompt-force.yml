name: Test install prompt force

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force visible install button on test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/app/+html.tsx')
          s = p.read_text()
          s = s.replace("var seenKey = 'rheinschiffer-install-v3';", "var seenKey = 'rheinschiffer-install-v4';")
          s = s.replace("if (hasSeen() || document.getElementById('rheinschiffer-install-button')) return;", "if (document.getElementById('rheinschiffer-install-button')) return;")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/app/+html.tsx
          git commit -m 'fix(test): show smartphone install button'
          git push origin test
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/test-install-prompt-force.yml || true
          git commit -m 'chore(test): remove temporary install workflow' || true
          git push origin test || true
