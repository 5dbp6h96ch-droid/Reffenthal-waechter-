name: Deploy test to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - 'artifacts/mobile/**'
      - 'lib/api-client-react/**'
      - '.github/workflows/deploy-test.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Match production pegel card in test build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/components/OriginalHomeScreen.tsx')
          s = p.read_text()
          old = """            <Text style={{
              fontSize: 9, fontFamily: 'SpaceGrotesk_700Bold',
              color: '#FFFFFF', letterSpacing: 2,
            }}>"""
          new = """            <Text style={{
              fontSize: 10, fontFamily: 'SpaceGrotesk_700Bold',
              color: '#FFFFFF', letterSpacing: 2,
            }}>"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          cd artifacts/mobile
          pnpm exec expo export --platform web --output-dir dist

      - name: Install PWA files and service worker
        run: |
          DIST=artifacts/mobile/dist
          VERSION=$(git rev-parse --short HEAD)
          sed "s/__CACHE_VERSION__/${VERSION}/g" artifacts/mobile/sw-template.js > "$DIST/sw.js"
          cp artifacts/mobile/public/push-sw.js "$DIST/push-sw.js"
          cp artifacts/mobile/public/icon-192.png "$DIST/icon-192.png"
          cp artifacts/mobile/public/icon-512.png "$DIST/icon-512.png"
          cp artifacts/mobile/public/apple-touch-icon.png "$DIST/apple-touch-icon.png"
          cp artifacts/mobile/public/favicon.png "$DIST/favicon.png"
          cp artifacts/mobile/public/manifest.webmanifest "$DIST/manifest.webmanifest"
          cp artifacts/mobile/public/leaflet.css "$DIST/leaflet.css"
          cp artifacts/mobile/public/test-layout.html "$DIST/test-layout.html"
          echo "✓ PWA-Dateien, Push-Service-Worker und Service Worker vorbereitet"

      - name: Deploy test build to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rheinschiffer-test
          directory: artifacts/mobile/dist
          branch: test

      - name: Deploy confirmed test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy \
            --name rheinschiffer-test \
            --compatibility-date 2026-08-21 \
            --assets artifacts/mobile/dist
