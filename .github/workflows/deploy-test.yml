    runs-on: ubuntu-latest
    steps:
      - name: Prevent obsolete Pages deployment
        shell: bash
        run: |
          echo "DEPLOYMENT BLOCKED"
          echo "Canonical test URL: https://rheinschiffer-test.5dbp6h96ch.workers.dev/"
