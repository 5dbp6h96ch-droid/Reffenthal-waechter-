name: Roll back confirmed test Worker

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/deploy-test.yml'

permissions:
  contents: read

jobs:
  rollback-worker:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Roll back rheinschiffer-test to previous Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 rollback \
            --name rheinschiffer-test \
            --message "Restore previous test Worker after accidental asset deploy"
