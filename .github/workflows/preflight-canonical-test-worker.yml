name: Preflight canonical rheinschiffer-test Worker

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/preflight-canonical-test-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify active Worker, schedules and public icon assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          GOOD='57cd69f3-d291-465f-b451-dbd8b4e46c88'
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/rheinschiffer-test/deployments" > /tmp/deployments.json
          jq -e '.success==true' /tmp/deployments.json >/dev/null
          ACTIVE=$(jq -r '.result.deployments[0].versions[0].version_id // ""' /tmp/deployments.json)
          test "$ACTIVE" = "$GOOD"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/rheinschiffer-test/schedules" > /tmp/schedules.json
          jq -e '.success==true' /tmp/schedules.json >/dev/null
          jq '[.result[]? | {cron,created_on,modified_on}]' /tmp/schedules.json > /tmp/safe-schedules.json

          mkdir -p canonical-test-worker/public/icons
          : > /tmp/icons.txt
          for icon in icon-192.png icon-512.png; do
            HTTP=$(curl -sSL -o "canonical-test-worker/public/icons/$icon" -w '%{http_code}' "https://rheinschiffer-test.5dbp6h96ch.workers.dev/icons/$icon")
            if [ "$HTTP" = '200' ]; then
              printf '%s\t200\t%s\t%s\n' "$icon" "$(wc -c < canonical-test-worker/public/icons/$icon | tr -d ' ')" "$(sha256sum canonical-test-worker/public/icons/$icon | awk '{print $1}')" >> /tmp/icons.txt
            else
              rm -f "canonical-test-worker/public/icons/$icon"
              printf '%s\t%s\n' "$icon" "$HTTP" >> /tmp/icons.txt
            fi
          done

          {
            echo "expected_active_version=$GOOD"
            echo "active_version=$ACTIVE"
            echo 'schedules:'
            cat /tmp/safe-schedules.json
            echo 'icons:'
            cat /tmp/icons.txt
          } > /tmp/preflight.txt
          cat /tmp/preflight.txt

      - name: Preserve discovered icons and cron config
        shell: bash
        run: |
          set -euo pipefail
          CRONS=$(jq -c '[.[]?.cron]' /tmp/safe-schedules.json)
          jq --argjson crons "$CRONS" '. + (if ($crons|length)>0 then {triggers:{crons:$crons}} else {} end)' canonical-test-worker/wrangler.jsonc > /tmp/wrangler.json
          mv /tmp/wrangler.json canonical-test-worker/wrangler.jsonc
          jq -e . canonical-test-worker/wrangler.jsonc >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical-test-worker/wrangler.jsonc canonical-test-worker/public/icons || true
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve canonical test Worker schedules and icons [skip ci]'
            git push origin HEAD:test
          fi

      - name: Record preflight receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "preflight=ok"; echo "checked_at=$TS"; cat /tmp/preflight.txt; } > /tmp/receipt.txt
          CONTENT=$(base64 -w0 /tmp/receipt.txt)
          PATH_NAME='deploy-receipts/canonical-test-worker-preflight.txt'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=test" --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Preflight canonical test Worker" -f content="$CONTENT" -f branch=test -f sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message="Preflight canonical test Worker" -f content="$CONTENT" -f branch=test
          fi
