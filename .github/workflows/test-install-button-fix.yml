name: Test install button fix

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add real React install button to test layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mobile/app/_layout.tsx')
          s = p.read_text()
          s = s.replace("import React, { useEffect } from 'react-native';", "import React, { useEffect, useState } from 'react';") if False else s
          s = s.replace("import React, { useEffect } from 'react';", "import React, { useEffect, useState } from 'react';")
          s = s.replace("import { Platform } from 'react-native';", "import { Platform, View, Text, TouchableOpacity } from 'react-native';")
          marker = "function RootLayoutNav() {"
          component = r'''function InstallPrompt() {
  const [visible, setVisible] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  const installPromptRef = React.useRef<any>(null);

  useEffect(() => {
    if (Platform.OS !== 'web') return;
    const nav = window.navigator as Navigator & { standalone?: boolean; maxTouchPoints?: number };
    const ua = nav.userAgent || '';
    const mobile = /iPhone|iPad|iPod|Android/i.test(ua) ||
      ((nav.maxTouchPoints || 0) > 1 && window.innerWidth < 900);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || nav.standalone === true;
    if (!mobile || standalone) return;

    setVisible(true);
    const onBeforeInstallPrompt = (event: any) => {
      event.preventDefault();
      installPromptRef.current = event;
    };
    window.addEventListener('beforeinstallprompt', onBeforeInstallPrompt);
    return () => window.removeEventListener('beforeinstallprompt', onBeforeInstallPrompt);
  }, []);

  if (!visible || Platform.OS !== 'web') return null;

  const ios = /iPhone|iPad|iPod/i.test(window.navigator.userAgent || '');

  const handlePress = async () => {
    const prompt = installPromptRef.current;
    if (prompt) {
      try {
        await prompt.prompt();
        await prompt.userChoice;
        installPromptRef.current = null;
        setVisible(false);
        return;
      } catch {}
    }
    setShowInfo(true);
  };

  return (
    <>
      <View style={{ position: 'absolute', left: 18, right: 18, bottom: 150, zIndex: 10000 }}>
        <TouchableOpacity
          onPress={handlePress}
          activeOpacity={0.85}
          style={{
            backgroundColor: '#007AFF', borderRadius: 16, paddingVertical: 14,
            paddingHorizontal: 18, alignItems: 'center',
            shadowColor: '#000', shadowOpacity: 0.18, shadowRadius: 10, elevation: 8,
          }}
        >
          <Text style={{ color: '#fff', fontSize: 16, fontWeight: '700' }}>
            Auf Smartphone installieren
          </Text>
        </TouchableOpacity>
      </View>

      {showInfo && (
        <View style={{
          position: 'absolute', left: 0, right: 0, top: 0, bottom: 0,
          backgroundColor: 'rgba(0,0,0,0.32)', zIndex: 10001,
          justifyContent: 'flex-end', padding: 18,
        }}>
          <View style={{ backgroundColor: '#fff', borderRadius: 24, padding: 22 }}>
            <Text style={{ fontSize: 21, fontWeight: '700', color: '#111', marginBottom: 12 }}>
              Auf dem Home-Bildschirm installieren
            </Text>
            <Text style={{ fontSize: 16, lineHeight: 24, color: '#555', marginBottom: 20 }}>
              {ios
                ? 'iPhone / iPad\n\n1. Tippe in Safari auf das Teilen-Symbol.\n2. Wähle „Zum Home-Bildschirm“.\n3. Tippe oben rechts auf „Hinzufügen“. '
                : 'Android\n\n1. Öffne das Browser-Menü ⋮.\n2. Wähle „App installieren“ oder „Zum Startbildschirm hinzufügen“.\n3. Bestätige die Installation.'}
            </Text>
            <TouchableOpacity
              onPress={() => setShowInfo(false)}
              style={{ backgroundColor: '#007AFF', borderRadius: 14, paddingVertical: 14, alignItems: 'center' }}
            >
              <Text style={{ color: '#fff', fontSize: 16, fontWeight: '700' }}>Verstanden</Text>
            </TouchableOpacity>
          </View>
        </View>
      )}
    </>
  );
}

'''
          if marker not in s:
              raise SystemExit('marker not found')
          if 'function InstallPrompt()' not in s:
              s = s.replace(marker, component + marker, 1)
          old = "<KeyboardProvider>\n              <RootLayoutNav />\n            </KeyboardProvider>"
          new = "<KeyboardProvider>\n              <RootLayoutNav />\n              <InstallPrompt />\n            </KeyboardProvider>"
          if old not in s:
              raise SystemExit('render marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit layout change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mobile/app/_layout.tsx
          git commit -m 'fix(test): render smartphone install button in app layout'
          git rm .github/workflows/test-install-button-fix.yml
          git commit -m 'chore(test): remove one-time install button workflow'
          git push origin test
