<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf4fd">
  <title>R(h)einschiffer – Test</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/action-icons.css">
  <style>
    .brand{width:min(720px,100%);margin:0 auto;padding:20px 14px 14px;text-align:left;display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-areas:"logo title" "logo sub";column-gap:15px;align-items:center}
    .brand-logo{grid-area:logo;width:104px;height:104px;display:block;object-fit:contain;border-radius:50%;background:#fff}
    .brand h1{grid-area:title;margin:0;align-self:end;font-size:clamp(32px,8vw,54px);line-height:.98;letter-spacing:-.045em;font-weight:750;white-space:nowrap;color:#101827}
    .brand p{grid-area:sub;margin:7px 0 0;align-self:start;font-size:clamp(14px,3.6vw,20px);line-height:1.2;color:#7e8288;white-space:nowrap}
    .menu-list{gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
    .menu-row{border:0!important;border-radius:0!important;min-height:58px;padding:7px 14px!important;background:#fff!important;border-bottom:1px solid var(--line)!important;display:grid!important;grid-template-columns:42px minmax(0,1fr) 30px;gap:12px;align-items:center;color:#181818!important}
    .menu-row:last-child{border-bottom:0!important}.menu-icon{width:38px;height:38px;border-radius:12px;background:#edf6ff;color:#0d82f7;display:flex;align-items:center;justify-content:center}.menu-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.menu-label{font-size:17px;font-weight:600;min-width:0}.menu-chevron{text-align:right}
    @media(max-width:430px){.brand{grid-template-columns:76px minmax(0,1fr);column-gap:12px;padding-top:16px}.brand-logo{width:76px;height:76px}.brand h1{font-size:clamp(28px,8vw,38px)}.brand p{font-size:13px}.menu-row{min-height:56px;grid-template-columns:38px minmax(0,1fr) 28px;gap:10px;padding:6px 11px!important}.menu-icon{width:36px;height:36px;border-radius:11px}.menu-icon svg{width:22px;height:22px}.menu-label{font-size:16px}}
  </style>
</head>
<body>
  <div class="test-banner">TESTUMGEBUNG</div>
  <header class="brand">
    <img class="brand-logo" src="https://raw.githubusercontent.com/5dbp6h96ch-droid/Reffenthal-waechter-/8620d979c3bd87020d94e9a3aa8a94f74dba39f9/artifacts/mobile/assets/images/icon.png" alt="Rhein Logo">
    <h1>R(h)einschiffer</h1>
    <p>Pegelvorhersage und News</p>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a href="#/hilfe" data-route="hilfe">Hilfe</a>
    <a href="#/einstellungen" data-route="einstellungen">Einstellungen</a>
  </nav>

  <script type="module" src="/app.js"></script>
</body>
</html>
